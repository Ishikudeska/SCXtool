name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: windows-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"
          host: windows
          target: desktop
          arch: win64_mingw
          dir: C:\
          tools: "tools_mingw1310 tools_ninja tools_cmake"
          cache: true
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: package
          max-size: 1G

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $identity = Get-Content cmake/AppIdentity.cmake -Raw
          if ($identity -notmatch 'set\(APP_VERSION\s+"([^"]+)"\)') { throw "APP_VERSION not found" }
          if ("v$($Matches[1])" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match APP_VERSION $($Matches[1])"
          }

      - name: Build and package
        shell: pwsh
        run: |
          $env:PATH = "C:\Qt\Tools\mingw1310_64\bin;C:\Qt\6.12.0\mingw_64\bin;C:\Qt\Tools\Ninja;C:\Qt\Tools\CMake_64\bin;$env:PATH"
          ./packaging/package.ps1

      - name: Upload the installer
        id: installer
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-Setup.exe
          archive: false
          if-no-files-found: error

      - name: Upload the portable zip
        id: portable
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-Portable-*.zip
          archive: false
          if-no-files-found: error

      - name: Link the packages on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          INSTALLER_URL: ${{ steps.installer.outputs.artifact-url }}
          PORTABLE_URL: ${{ steps.portable.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const file = (pattern) => fs.readdirSync('dist').find((name) => pattern.test(name));
            const heading = '### Packages built from this pull request';
            const body = [
              heading,
              '',
              `From ${context.payload.pull_request.head.sha}:`,
              '',
              `- [${file(/-Setup\.exe$/)}](${process.env.INSTALLER_URL})`,
              `- [${file(/-Portable-.*\.zip$/)}](${process.env.PORTABLE_URL})`,
              '',
              'Downloading needs a GitHub sign-in, and the files expire with the workflow run\'s artifacts.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const earlier = (await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number }))
              .filter((c) => c.user.login === 'github-actions[bot]' && c.body.startsWith(heading));
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
            for (const comment of earlier) {
              await github.graphql(
                'mutation($id: ID!) { minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) { minimizedComment { isMinimized } } }',
                { id: comment.node_id },
              );
            }

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/*-Setup.exe
            dist/*-Portable-*.zip
