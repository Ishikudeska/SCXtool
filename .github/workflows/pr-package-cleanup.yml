name: PR Package Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  pull-requests: write

jobs:
  cleanup:
    if: github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the pull request's packages
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.payload.pull_request.head.ref;
            const runs = (await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'release.yml', event: 'pull_request', branch,
            })).filter((run) => run.head_repository && run.head_repository.full_name === `${owner}/${repo}`);
            let deleted = 0;
            for (const run of runs) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner, repo, run_id: run.id,
              });
              for (const artifact of artifacts.filter((a) => !a.expired)) {
                try {
                  await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                  deleted++;
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }
            core.info(`Deleted ${deleted} artifacts from ${runs.length} Release runs on ${branch}.`);

      - name: Mark the package comments as deleted
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const heading = '### Packages built from this pull request';
            const note = '_The files were deleted when this pull request was merged._';
            const comments = (await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number }))
              .filter((c) => c.user.login === 'github-actions[bot]' && c.body.startsWith(heading));
            for (const comment of comments) {
              if (!comment.body.endsWith(note)) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: comment.id, body: `${comment.body}\n\n${note}`,
                });
              }
              await github.graphql(
                'mutation($id: ID!) { minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) { minimizedComment { isMinimized } } }',
                { id: comment.node_id },
              );
            }
