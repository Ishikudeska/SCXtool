name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check C++ formatting
        run: git ls-files -z '*.cpp' '*.h' | xargs -0 pipx run --spec clang-format==22.1.8 clang-format --dry-run -Werror

  debug:
    runs-on: windows-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt 6.12 + MinGW 13.1 + Ninja
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          dir: 'C:\'
          tools: 'tools_mingw1310 tools_ninja'
          cache: true
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: debug
          max-size: 1G

      - name: Put lld on PATH
        run: echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Configure
        run: cmake --preset mingw-debug -DSC_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset mingw-debug

      - name: Lint QML
        run: cmake --build --preset mingw-debug --target all_qmllint

      - name: Test
        run: ctest --preset mingw-debug -LE parity

  release:
    runs-on: windows-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt 6.12 + MinGW 13.1 + Ninja
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          dir: 'C:\'
          tools: 'tools_mingw1310 tools_ninja'
          cache: true
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release
          max-size: 1G

      - name: Build release
        run: |
          cmake --preset mingw-release -DSC_WARNINGS_AS_ERRORS=ON
          cmake --build --preset mingw-release
