<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- SCXtool app icon, 48 px and up: a pilot's visor with HUD text across the glass.
       resources/icon/app-small.svg is the 16-32 px version; tools/icon/build_ico.py builds app.ico. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5566"/>
      <stop offset="1" stop-color="#1b222d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d3a5c"/>
      <stop offset="0.55" stop-color="#0a2540"/>
      <stop offset="1" stop-color="#061526"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ear pods -->
  <rect x="14" y="112" width="26" height="64" rx="10" fill="#2a3340" stroke="#0e131a" stroke-width="4"/>
  <rect x="216" y="112" width="26" height="64" rx="10" fill="#2a3340" stroke="#0e131a" stroke-width="4"/>

  <!-- shell -->
  <path d="M128 14 C68 14 28 60 28 122 L28 166 C28 202 52 228 88 236 L168 236 C204 228 228 202 228 166 L228 122 C228 60 188 14 128 14 Z"
        fill="url(#shell)" stroke="#0e131a" stroke-width="6"/>
  <!-- crest ridge -->
  <path d="M112 22 L144 22 L140 56 L116 56 Z" fill="#5d6a7d" opacity="0.7"/>

  <!-- chin vents -->
  <rect x="100" y="198" width="56" height="7" rx="3.5" fill="#0e131a"/>
  <rect x="106" y="212" width="44" height="7" rx="3.5" fill="#0e131a"/>

  <!-- visor -->
  <path d="M48 98 C48 80 62 68 80 68 L176 68 C194 68 208 80 208 98 L208 142 C208 166 190 182 166 182 L90 182 C66 182 48 166 48 142 Z"
        fill="url(#glass)" stroke="#0e131a" stroke-width="5"/>
  <path d="M50 98 C50 81 63 70 80 70 L176 70 C193 70 206 81 206 98 L206 142 C206 165 189 180 166 180 L90 180 C67 180 50 165 50 142 Z"
        fill="none" stroke="#2fb8f0" stroke-width="2" opacity="0.6"/>

  <!-- HUD text: a [TAG] then lines of text -->
  <g fill="none" stroke="#ffb347" stroke-width="4" stroke-linecap="square">
    <path d="M74 90 H67 V112 H74"/>
    <path d="M118 90 H125 V112 H118"/>
  </g>
  <rect x="77" y="97" width="38" height="8" rx="2" fill="#ffb347"/>
  <rect x="134" y="97" width="52" height="8" rx="2" fill="#e8fbff"/>
  <rect x="67" y="122" width="96" height="8" rx="2" fill="#7fdcff"/>
  <rect x="169" y="122" width="17" height="8" rx="2" fill="#7fdcff"/>
  <rect x="67" y="144" width="62" height="8" rx="2" fill="#7fdcff" opacity="0.6"/>
  <rect x="135" y="144" width="40" height="8" rx="2" fill="#7fdcff" opacity="0.6"/>

  <!-- glare -->
  <path d="M58 100 C58 86 68 78 82 78 L150 78 C120 84 86 100 62 128 C59 120 58 110 58 100 Z" fill="url(#glare)"/>
</svg>
